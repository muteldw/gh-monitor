<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub 현황</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;padding:12px;background:#f6f8fa;color:#1f2328}
h1{font-size:18px}.sub{color:#656d76;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:10px}
.card b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d0d7de;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid #eaeef2;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{background:#f6f8fa}
.wrap{overflow-x:auto}.ok{color:#1a7f37}.bad{color:#cf222e}.mid{color:#9a6700}
svg{background:#fff;border:1px solid #d0d7de;border-radius:8px;width:100%;margin-top:12px}
</style></head><body>
<h1>GitHub 현황</h1><div class="sub" id="upd">불러오는 중…</div>
<div class="cards" id="cards"></div>
<div class="wrap"><table id="t"><thead><tr><th>저장소</th><th>7일 커밋</th><th>30일 커밋</th><th>마지막 푸시</th><th>Pages</th><th>용량</th><th>Actions 누적</th><th>실패</th></tr></thead><tbody></tbody></table></div>
<h2 style="font-size:15px;margin:16px 0 4px">저장소 용량 히트맵</h2>
<div class="sub">크기 = 용량 · 색 = 최근 30일 커밋(진할수록 활발) · 작은 저장소는 최소 크기로 표시</div>
<div id="tm" style="margin-top:6px"></div>
<div style="margin:6px 0 0"><button id="tmsave" style="font:inherit;font-size:13px;padding:7px 12px;border:1px solid #d0d7de;border-radius:8px;background:#fff;cursor:pointer">PNG 이미지 저장</button> <span class="sub" id="tmmsg"></span></div>
<svg id="chart" viewBox="0 0 600 160"></svg><div class="sub">일별 총 용량(MB, 파랑) · Actions 누적 시간(분, 주황)</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
let tmEl;
const ago=s=>{if(!s)return'-';const m=(Date.now()-new Date(s))/6e4;return m<60?Math.round(m)+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'};
const mb=k=>(k/1024).toFixed(1)+' MB',hm=s=>s<3600?Math.round(s/60)+'분':(s/3600).toFixed(1)+'시간';
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
 const R=Object.entries(d.repos).sort((a,b)=>new Date(b[1].pushed_at)-new Date(a[1].pushed_at));
 const sum=f=>R.reduce((s,[,v])=>s+f(v),0);
 const K=x=>x.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
 const u=new Date(d.updated),nx=new Date(Date.UTC(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),Math.floor(u.getUTCHours()/6)*6+6));
 upd.innerHTML='수집: '+K(u)+'<br>다음 자동 수집(예정): '+K(nx)+' · 6시간 주기 · 저장소 '+R.length+'개';
 cards.innerHTML=[['7일 커밋',sum(v=>v.commits_7d)],['30일 커밋',sum(v=>v.commits_30d)],['총 용량',mb(sum(v=>v.size_kb))],['Actions 누적',hm(sum(v=>v.actions_total_sec))],['Actions 실행',sum(v=>v.actions_runs_total)+'회']]
  .map(([k,v])=>`<div class="card">${k}<b>${v}</b></div>`).join('');
 t.tBodies[0].innerHTML=R.map(([n,v])=>{const p=v.pages;
  const ps=!p?'-':(p.build==='built'?'<span class=ok>●정상</span>':p.build==='errored'?'<span class=bad>●오류</span>':'<span class=mid>●'+(p.build||p.status||'확인불가')+'</span>');
  return `<tr><td><a href="${v.url}">${n}</a>${v.private?' 🔒':''}</td><td>${v.commits_7d}</td><td>${v.commits_30d}</td><td>${ago(v.pushed_at)}</td><td>${p?`<a href="${p.url}">${ps}</a>`:ps}</td><td>${mb(v.size_kb)}</td><td>${hm(v.actions_total_sec)}</td><td class="${v.actions_fail_total?'bad':''}">${v.actions_fail_total}</td></tr>`}).join('');
 
 (function(){
  const W=600,H=320,tot=sum(v=>v.size_kb)||1,mx=Math.max(1,...R.map(([,v])=>v.commits_30d));
  const root=d3.hierarchy({children:R.map(([n,v])=>({n,s:v.size_kb,c:v.commits_30d,pr:v.private}))}).sum(x=>x.children?0:Math.max(x.s,tot*0.012)).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingInner(2)(root);
  const col=d3.scaleLinear([0,mx],['#f3f6fa','#a8c5e8']);
  tmEl=document.getElementById('tm');tmEl.innerHTML='';
  const s=d3.select(tmEl).append('svg').attr('id','tmsvg').attr('xmlns','http://www.w3.org/2000/svg').attr('viewBox','0 0 '+W+' '+H).attr('width','100%').attr('font-family','system-ui,sans-serif');
  s.append('rect').attr('width',W).attr('height',H).attr('fill','#fff');
  const g=s.selectAll('g').data(root.leaves()).join('g').attr('transform',x=>'translate('+x.x0+','+x.y0+')');
  g.append('rect').attr('width',x=>x.x1-x.x0).attr('height',x=>x.y1-x.y0).attr('rx',3).attr('fill',x=>col(x.data.c));
  g.filter(x=>x.x1-x.x0>60&&x.y1-x.y0>34).each(function(x){const e=d3.select(this),k='#2d3a4a';
   e.append('text').attr('x',6).attr('y',17).attr('font-size',12).attr('font-weight',600).attr('fill',k).text(x.data.n+(x.data.pr?' (비공개)':''));
   e.append('text').attr('x',6).attr('y',32).attr('font-size',11).attr('fill',k).text(mb(x.data.s)+' · 30일 '+x.data.c+'커밋');});
  document.getElementById('tmsave').onclick=async()=>{const m=document.getElementById('tmmsg');
   try{const svg=new XMLSerializer().serializeToString(document.getElementById('tmsvg'));
    const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);x.drawImage(img,0,0,W,H);
    const b=await new Promise(r=>c.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='github-repo-size-heatmap.png';document.body.appendChild(a);a.click();a.remove();m.textContent='저장 요청됨'}
   catch(e){m.textContent='이 화면에선 저장이 막혀 있어요. 실시간 대시보드에서 저장하세요.'}};
 })();
 const H=d.history||[];if(H.length>1){const line=(f,c)=>{const mx=Math.max(...H.map(f))||1;return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${H.map((h,i)=>`${10+i*580/(H.length-1)},${150-f(h)/mx*130}`).join(' ')}"/>`};
  chart.innerHTML=line(h=>h.size_kb,'#0969da')+line(h=>h.actions_min,'#d4690a')}
}).catch(e=>upd.textContent='data.json 없음 — Actions를 한 번 실행하세요');
</script></body></html>
